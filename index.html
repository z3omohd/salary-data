<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasan Financial Suite - المنظومة المالية الخاصّة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
            --primary-blue: #2563eb;
            --primary-red: #dc2626;
            --primary-green: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        /* شاشة تسجيل الدخول والتوثيق */
        .auth-card {
            max-width: 420px;
            margin: 20px auto;
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 20px;
            color: #0f172a;
            font-size: 1.4rem;
        }

        .auth-card input {
            margin-bottom: 12px;
        }

        .btn-google {
            background-color: #ffffff;
            color: #334155;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-google:hover { background-color: #f8fafc; }

        /* شريط معلومات الحساب */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f1f5f9;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }

        .btn-blue { background-color: var(--primary-blue); color: white; }
        .btn-red { background-color: var(--primary-red); color: white; }
        .btn-dark { background-color: #334155; color: white; }
        .btn-del {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: 1px solid #fca5a5;
            cursor: pointer;
        }
        .btn-del:hover { background-color: #fca5a5; }

        .btn:hover { opacity: 0.9; }

        input, select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .grid-tables {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid-tables { grid-template-columns: 1fr; }
            .controls-bar, .user-bar { flex-direction: column; gap: 12px; }
        }

        .table-wrapper {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.95rem;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th { color: white; font-weight: 600; }
        .liabilities-table th { background-color: var(--primary-red); }
        .assets-table th { background-color: var(--primary-blue); }

        .total-row td { font-weight: bold; background-color: #f8fafc; }
        .assets-total td { background-color: #dcfce7; color: #166534; }
        .liabilities-total td { background-color: #fee2e2; color: #991b1b; }

        .net-worth-box {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .verify-box {
            background-color: #fef3c7;
            border: 1px solid #f59e0b;
            color: #92400e;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="authSection" class="auth-card">
            <h2>تسجيل الدخول للمحفظة المالية</h2>
            
            <button class="btn btn-google" id="googleLoginBtn">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                الدخول بواسطة Google
            </button>

            <div style="margin: 15px 0; color: #94a3b8; font-size: 0.85rem;">أو بالبريد الإلكتروني</div>

            <input type="email" id="emailInput" placeholder="البريد الإلكتروني">
            <input type="password" id="passwordInput" placeholder="كلمة المرور">
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button class="btn btn-blue" id="loginBtn" style="flex:1;">تسجيل الدخول</button>
                <button class="btn btn-dark" id="signUpBtn" style="flex:1;">إنشاء حساب</button>
            </div>
            
            <p id="authError" style="color: var(--primary-red); margin-top: 15px; font-size: 0.85rem;"></p>

            <!-- صندوق التنبيه في حال عدم توثيق البريد -->
            <div id="verifyBox" class="verify-box hidden">
                تم إرسال رابط التفعيل إلى إيميلك. يرجى تأكيد البريد الإلكتروني للوصول لبياناتك.
                <br><br>
                <button class="btn btn-dark" id="resendVerifyBtn" style="font-size: 0.8rem; padding: 5px 10px;">إعادة إرسال رابط التفعيل</button>
                <button class="btn btn-blue" id="checkVerifiedBtn" style="font-size: 0.8rem; padding: 5px 10px; margin-right: 5px;">تم التفعيل، ادخل الآن</button>
            </div>
        </div>

        <!-- التطبيق الرئيسي المتكامل -->
        <div id="appSection" class="hidden">
            <div class="user-bar">
                <div style="font-size: 0.95rem;">المستخدم الحالي: <strong id="userEmailLabel"></strong></div>
                <button class="btn btn-dark" id="logoutBtn">تسجيل الخروج</button>
            </div>

            <div class="controls-bar">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="insertPosition" style="font-size: 0.9rem;">موقع إضافة الصفوف:</label>
                    <select id="insertPosition" style="width: auto;">
                        <option value="bottom">أسفل الجدول</option>
                        <option value="top">أعلى الجدول</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-red" id="addLiabilityBtn">+ إضافة التزام/فاتورة</button>
                    <button class="btn btn-blue" id="addAssetBtn">+ إضافة أصل/إيراد</button>
                </div>
            </div>

            <div class="grid-tables">
                <!-- جدول الالتزامات -->
                <div class="table-wrapper">
                    <table class="liabilities-table">
                        <thead>
                            <tr>
                                <th style="width: 30px;"></th>
                                <th style="width: 120px;">المبلغ (ر.س)</th>
                                <th>الالتزامات</th>
                            </tr>
                        </thead>
                        <tbody id="liabilitiesBody"></tbody>
                    </table>
                </div>

                <!-- جدول الأصول -->
                <div class="table-wrapper">
                    <table class="assets-table">
                        <thead>
                            <tr>
                                <th style="width: 30px;"></th>
                                <th style="width: 120px;">المبلغ (ر.س)</th>
                                <th>البند</th>
                            </tr>
                        </thead>
                        <tbody id="assetsBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="net-worth-box">
                <span class="net-value" id="netTotal" style="color:#166534;">0.00 ر.س</span>
                <span style="font-size: 0.95rem; color: #64748b;">الصافي المتبقي (الأصول - الالتزامات)</span>
            </div>
        </div>
    </div>

    <!-- ربط مكتبات Firebase عبر CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDi9gUklNkyIyPo2NBHBPMcX1a2moRmpqc",
            authDomain: "financial-60e4a.firebaseapp.com",
            projectId: "financial-60e4a",
            storageBucket: "financial-60e4a.firebasestorage.app",
            messagingSenderId: "889252276037",
            appId: "1:889252276037:web:81d337ae9471f2c215c02c",
            measurementId: "G-2CL4NXC0Y4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;
        let userData = { liabilities: [], assets: [] };

        // التحقق من حالة المستخدم وتأكيد البريد
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // إذا دخل بواسطة Google أو كان إيميله موثقاً
                if (user.emailVerified || user.providerData[0].providerId === 'google.com') {
                    currentUser = user;
                    document.getElementById('userEmailLabel').innerText = user.email || user.displayName;
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('verifyBox').classList.add('hidden');
                    document.getElementById('appSection').classList.remove('hidden');
                    await loadUserData();
                } else {
                    // المستخدم سجل بالإيميل ولم يفعل الرابط بعد
                    currentUser = user;
                    document.getElementById('authSection').classList.remove('hidden');
                    document.getElementById('verifyBox').classList.remove('hidden');
                    document.getElementById('appSection').classList.add('hidden');
                    document.getElementById('authError').innerText = '';
                }
            } else {
                currentUser = null;
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('verifyBox').classList.add('hidden');
                document.getElementById('appSection').classList.add('hidden');
            }
        });

        // تسجيل الدخول بـ Google (معتمد وموثق تلقائياً من Google)
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                document.getElementById('authError').innerText = '';
            } catch (err) {
                try {
                    await signInWithRedirect(auth, googleProvider);
                } catch (redErr) {
                    document.getElementById('authError').innerText = 'تعذر تسجيل الدخول بـ Google.';
                }
            }
        });

        // تسجيل الدخول بالبريد وكلمة المرور
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            try {
                const userCred = await signInWithEmailAndPassword(auth, email, password);
                if (!userCred.user.emailVerified) {
                    document.getElementById('verifyBox').classList.remove('hidden');
                } else {
                    document.getElementById('authError').innerText = '';
                }
            } catch (err) {
                document.getElementById('authError').innerText = 'خطأ في البريد أو كلمة المرور.';
            }
        });

        // إنشاء حساب جديد وإرسال رابط التفعيل
        document.getElementById('signUpBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                await sendEmailVerification(userCred.user);
                document.getElementById('verifyBox').classList.remove('hidden');
                document.getElementById('authError').innerText = '';
            } catch (err) {
                document.getElementById('authError').innerText = 'تعذر إنشاء الحساب، يرجى كتابة إيميل صحيح وكلمة مرور 6 خانات فأكثر.';
            }
        });

        // إعادة إرسال رابط التفعيل
        document.getElementById('resendVerifyBtn').addEventListener('click', async () => {
            if (auth.currentUser) {
                await sendEmailVerification(auth.currentUser);
                alert('تم إرسال رابط التفعيل إلى بريدك الإلكتروني بنجاح!');
            }
        });

        // التحقق بعد النقر على رابط التفعيل بالإيميل
        document.getElementById('checkVerifiedBtn').addEventListener('click', async () => {
            if (auth.currentUser) {
                await auth.currentUser.reload();
                if (auth.currentUser.emailVerified) {
                    location.reload();
                } else {
                    alert('لم يتم تفعيل البريد بعد، يرجى فتح الإيميل والنقر على الرابط.');
                }
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        async function loadUserData() {
            if (!currentUser) return;
            const docRef = doc(db, "usersFinancialData", currentUser.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                userData = docSnap.data();
            } else {
                userData = { liabilities: [], assets: [] };
                await saveData();
            }
            renderTables();
        }

        async function saveData() {
            if (!currentUser) return;
            await setDoc(doc(db, "usersFinancialData", currentUser.uid), userData);
        }

        function renderTables() {
            const liabilitiesBody = document.getElementById('liabilitiesBody');
            const assetsBody = document.getElementById('assetsBody');
            liabilitiesBody.innerHTML = '';
            assetsBody.innerHTML = '';

            let totalLiabilities = 0;
            let totalAssets = 0;

            if (userData.liabilities.length === 0) {
                liabilitiesBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding:15px;">لا توجد التزامات مسجلة</td></tr>`;
            } else {
                userData.liabilities.forEach((item, index) => {
                    totalLiabilities += Number(item.amount) || 0;
                    liabilitiesBody.innerHTML += `
                        <tr>
                            <td><button class="btn-del" onclick="deleteRow('liability', ${index})">✕</button></td>
                            <td><input type="number" value="${item.amount}" data-type="liability" data-index="${index}"></td>
                            <td><input type="text" value="${item.name}" data-type="liability-name" data-index="${index}"></td>
                        </tr>`;
                });
            }

            liabilitiesBody.innerHTML += `<tr class="total-row liabilities-total"><td colspan="3">مجموع الالتزامات: ${totalLiabilities.toFixed(2)} ر.س</td></tr>`;

            if (userData.assets.length === 0) {
                assetsBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding:15px;">لا توجد أصول مسجلة</td></tr>`;
            } else {
                userData.assets.forEach((item, index) => {
                    totalAssets += Number(item.amount) || 0;
                    assetsBody.innerHTML += `
                        <tr>
                            <td><button class="btn-del" onclick="deleteRow('asset', ${index})">✕</button></td>
                            <td><input type="number" value="${item.amount}" data-type="asset" data-index="${index}"></td>
                            <td><input type="text" value="${item.name}" data-type="asset-name" data-index="${index}"></td>
                        </tr>`;
                });
            }

            assetsBody.innerHTML += `<tr class="total-row assets-total"><td colspan="3">مجموع الأصول: ${totalAssets.toFixed(2)} ر.س</td></tr>`;

            document.getElementById('netTotal').innerText = `${(totalAssets - totalLiabilities).toFixed(2)} ر.س`;
            attachEvents();
        }

        function attachEvents() {
            document.querySelectorAll('input[data-type]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const type = e.target.getAttribute('data-type');
                    const index = e.target.getAttribute('data-index');
                    const val = e.target.value;

                    if (type === 'liability') userData.liabilities[index].amount = parseFloat(val) || 0;
                    if (type === 'liability-name') userData.liabilities[index].name = val;
                    if (type === 'asset') userData.assets[index].amount = parseFloat(val) || 0;
                    if (type === 'asset-name') userData.assets[index].name = val;

                    saveData();
                    renderTables();
                });
            });
        }

        window.deleteRow = function(type, index) {
            if (type === 'asset') {
                userData.assets.splice(index, 1);
            } else if (type === 'liability') {
                userData.liabilities.splice(index, 1);
            }
            saveData();
            renderTables();
        };

        document.getElementById('addAssetBtn').addEventListener('click', () => {
            const pos = document.getElementById('insertPosition').value;
            const item = { name: "", amount: 0 };
            pos === 'top' ? userData.assets.unshift(item) : userData.assets.push(item);
            saveData();
            renderTables();
        });

        document.getElementById('addLiabilityBtn').addEventListener('click', () => {
            const pos = document.getElementById('insertPosition').value;
            const item = { name: "", amount: 0 };
            pos === 'top' ? userData.liabilities.unshift(item) : userData.liabilities.push(item);
            saveData();
            renderTables();
        });
    </script>
</body>
</html>
